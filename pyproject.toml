[project]
name = "munder-difflin-multi-agent-system"
version = "1.0.0"
description = "A production-minded multi-agent quoting and fulfillment system"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sammy Basha" }]
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.11",
    "pydantic-ai-slim[openai]>=2.0.0",
    "pydantic-settings>=2.10",
    "python-dotenv>=1.1",
    "rich>=14.0",
    "sqlalchemy>=2.0",
]

[project.scripts]
munder-difflin = "munder_difflin.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
    "ty>=0.0.1a16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/munder_difflin"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"project_starter.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.11"
